---
layout: blog
---

<div class="wrapper wrapper-content  animated fadeInRight article">
  <div class="row">
    <div class="col-lg-10 col-lg-offset-1">
      <div class="ibox">
        <div class="ibox-content">
          <div class="text-center article-title">
          <span class="text-muted"><i class="fa fa-clock-o"></i> {{ page.date | date: "%-d %b %Y" }}</span>
            <h1>
              {{ page.title }}
            </h1>
          </div>
          	{{ content }}
          <hr>
          <div class="row">
            <div class="col-md-6">
              <h5 style="display: inline;">Categories:</h5>
              {% for category in page.categories %}
                <button class="btn btn-white btn-xs" type="button"><a href="/blog/{{ category | capitalize }}">{{ category }}</a></button>
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
