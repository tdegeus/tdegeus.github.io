<div class="container">
  <div class="row">
    <div class="col-lg-12 text-center">
      <div class="navy-line"></div>
      <h1>Featured software</h1>
    </div>
  </div>
  <div class="row features-block">
    <div class="col-lg-12">
      <div id="vertical-timeline" class="vertical-container light-timeline center-orientation">
      {% for program in site.data.software %}
      {% assign loopindex = forloop.index | modulo: 2 %}
        <div class="vertical-timeline-block">
          <div class="vertical-timeline-icon navy-bg wow rotateIn">
            <i class="fa {{ program.icon }}"></i>
          </div>
          <div class="vertical-timeline-content wow {% if loopindex == 1 %} rotateInUpRight {% else %} rotateInUpLeft {% endif %}">
            <h2>{{ program.name }}</h2>
            <p>{{ program.desc }}</p>
            <span class="vertical-date">{{ program.license }}<br/> <small>{{ program.keywords }}</small>
            </span>
          </div>
        </div>
      {% endfor %}
      </div>
    </div>
  </div>
  <div>
  <center><h3><a href="/software.html">More...</a></h3></center><br />
  </div>
</div>
