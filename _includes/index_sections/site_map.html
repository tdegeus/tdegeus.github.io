<div class="container">
  <div class="row m-b-lg">
    <div class="col-lg-12 text-center">
      <div class="navy-line"></div>
      <h1>Site Map</h1>
    </div>
  </div>
  <div class="row">
    <div class="col-xs-2 wow zoomIn" id="column0" style="float:left; margin:0; width:20%;">
    </div>
    <div class="col-xs-2 wow zoomIn" id="column1" style="float:left; margin:0; width:20%;">
      <a class="page-scroll" href="/index.html">Home</a><br />
    </div>
    <div class="col-xs-2 wow zoomIn" id="column2" style="float:left; margin:0; width:20%;">
      <h5>Pages:</h5>
      {% for tag in site.data.pages %}
      <a class="page-scroll" href="{{ tag.href }}">{{ tag.name }}</a><br />
      {% endfor %}
    </div>
    <div class="col-xs-2 wow zoomIn" id="column3" style="float:left; margin:0; width:20%;">
      <h5>Blog catergories:</h5>
      {% for tag in site.data.blog %}
      <a class="page-scroll" href="{{ tag.href }}">{{ tag.name }}</a><br />
      {% endfor %}
    </div>
  </div>
</div>
