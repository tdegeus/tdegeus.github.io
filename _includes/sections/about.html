<div class="container">
  <div class="row m-b-lg">
    <div class="col-lg-12 text-center">
      <div class="navy-line"></div>
      <h1>{{ site.author.name }}</h1>
    </div>
  </div>
  <div class="row">
    <!-- icon 1 (left) -->
    <div class="col-xs-2 wow fadeInLeft">
      <div class="team-member">
        <div class="vote-icon">
          <a href="https://github.com/{{ site.author.github_username }}" target="blank"><i class="fa fa-github"></i>
        </div>
      </div>
    </div>
    <!-- icon 2 (left) -->
    <div class="col-xs-2 wow fadeInLeft">
      <div class="team-member">
        <div class="vote-icon">
          <a href="https://linkedin.com/in/{{ site.author.linkedin_username }}" target="blank"><i class="fa fa-linkedin-square"></i>
        </div>
      </div>
    </div>
    <!-- avatar -->
    <div class="col-xs-4">
      <div class="team-member wow zoomIn">
        <img src="{{ site.author.avatar | prepend: site.baseurl }}" height="110" width="110" class="img-responsive img-circle" alt="">
      </div>
    </div>
    <!-- icon 3 (right) -->
    <div class="col-xs-2 wow fadeInRight">
      <div class="team-member">
        <div class="vote-icon">
          <a href="mailto:{{ site.author.email }}"><i class="fa fa-envelope-o"></i></a>
        </div>
      </div>
    </div>
    <!-- icon 4 (right) -->
    <div class="col-xs-2 wow fadeInRight">
      <div class="team-member">
        <div class="vote-icon">
          <a href="{{ site.url}}/feed.xml" target="blank"><i class="fa fa-rss"></i></a>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-8 col-lg-offset-2 text-center m-t-lg m-b-lg wow zoomIn">
      <p>{{ site.author.desc }}</p>
    </div>
  </div>
  <div>
  <center><h3><a href="/about/about.html">More...</a></h3></center><br />
  </div>
</div>
