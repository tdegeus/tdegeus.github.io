
- name: How collective asperity detachments nucleate slip at frictional interfaces
  date: 2019
  icon: fa-book
  journal: Proceedings of the National Academy of Sciences (PNAS), USA
  doi: 10.1073/pnas.1906551116
  arxiv: 1904.07635
  desc:
    This paper proposes a microscopic theory the explain and predict
    stick-slip friction. It avoids postulating a phenomenological friction
    law. Instead, the presumed phenomenology emerges through a combination of
    microscopic disorder and inertia.

- name: Finite strain FFT-based non-linear solvers made simple
  date: 2017
  icon: fa-book
  journal: Computer Methods in Applied Mechanics and Engineering
  doi: 10.1016/j.cma.2016.12.032
  arxiv: 1603.08893
  desc:
    This paper extends the FFT-based solver to finite strain, and is aimed to
    make the method accessible. This publication is supported by simple and
    compact numerical examples.

- name: "Fracture in multi-phase materials: why some microstructures are more critical than others"
  date: 2017
  icon: fa-book
  journal: Engineering Fracture Mechanics
  doi: 10.1016/j.engfracmech.2016.08.009
  arxiv: 1603.08910
  desc:
    This paper unravels the onset and early stages of failure of a two-phase
    material (a dual-phase steel in particular). In addition, it summarises
    statistical tools that can be used to unravel a critical process (like
    fracture). I believe it to be a good start to explore other papers that
    I wrote.

