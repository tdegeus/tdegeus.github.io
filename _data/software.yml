
- name: 'GooseFFT'
  url: 'http://goosefft.geus.me'
  img: 'static/img/landing/goosefft.png'
  desc:
    GooseFFT provides extremely simple examples to learn and start using the
    FFT-based solver for micromechanics.

- name: 'GooseEYE'
  url: 'http://gooseeye.geus.me'
  img: 'static/img/landing/gooseeye.png'
  desc:
    GooseEYE is a toolbox to perform geometrical statistics on microstructures
    and interfaces. It also features a graphical user-interface, such that it
    can be used as stand-alone software.

- name: 'GooseLaTeX'
  url: 'http://gooselatex.geus.me'
  img: 'static/img/landing/gooselatex.png'
  desc:
    GooseLaTeX feature several styles to avoid some manual labor in writing an
    article, a thesis, or several corporate documents such as proposals. It
    also includes some efficient command-line tools.
